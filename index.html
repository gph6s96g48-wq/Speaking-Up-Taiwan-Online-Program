<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaking Up 台灣全英文口說課程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAF6EE; --board: #ffffff; --ink: #1F2B24; --ink-soft: #5B6960;
    --teal: #14685A; --teal-deep: #0D4A40; --lime: #A9CB3B; --coral: #F2764B;
    --line: #E4DCC8; --shadow: 0 10px 30px -14px rgba(20,104,90,0.28);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(circle at 12% 8%, rgba(169,203,59,0.10), transparent 40%),
      radial-gradient(circle at 90% 0%, rgba(20,104,90,0.08), transparent 45%),
      var(--bg);
    color:var(--ink); font-family:'Noto Sans TC', sans-serif;
    display:flex; align-items:center; justify-content:center; padding:28px 16px;
  }
  .wrap{max-width:720px; width:100%; position:relative;}
  .lang-toggle{
    position:absolute; top:-8px; right:0; display:flex; gap:4px;
    background:#EFE9D8; border-radius:100px; padding:3px;
  }
  .lang-toggle button{
    border:none; background:transparent; font-family:'JetBrains Mono',monospace;
    font-size:11.5px; font-weight:700; padding:6px 12px; border-radius:100px; cursor:pointer; color:var(--ink-soft);
  }
  .lang-toggle button.active{ background:var(--teal-deep); color:#fff; }
  .brand-eyebrow{
    font-family:'JetBrains Mono', monospace; letter-spacing:0.14em; text-transform:uppercase;
    font-size:11px; color:var(--teal); font-weight:600; display:flex; align-items:center; gap:8px; margin-bottom:10px;
  }
  .brand-eyebrow::before{ content:""; width:8px; height:8px; background:var(--lime); border-radius:2px; display:inline-block; }
  h1{
    font-family:'Noto Serif TC', serif; font-weight:900; font-size: clamp(26px, 4.5vw, 36px);
    margin: 0 0 8px; color:var(--teal-deep); line-height:1.2;
  }
  .subtitle{color:var(--ink-soft); font-size:14.5px; max-width:560px; line-height:1.6; margin-bottom:32px;}
  .cards{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:600px){ .cards{ grid-template-columns:1fr; } .lang-toggle{ position:static; margin-bottom:16px; display:inline-flex; } }
  .card{
    background:var(--board); border-radius:16px; box-shadow:var(--shadow);
    padding:28px 22px; display:flex; flex-direction:column; gap:12px; text-align:left;
    text-decoration:none; color:inherit; transition:transform .15s ease;
  }
  .card:hover{ transform:translateY(-3px); }
  .card .emoji{ font-size:32px; }
  .card .title{ font-weight:700; font-size:19px; color:var(--ink); }
  .card .desc{ font-size:13px; color:var(--ink-soft); line-height:1.6; }
  .card .cta{
    margin-top:auto; align-self:flex-start; color:#fff; border:none;
    font-weight:700; font-size:13.5px; padding:10px 18px; border-radius:100px;
  }
  .cta.volunteer{ background:var(--coral); }
  .cta.student{ background:var(--teal-deep); }
</style>
</head>
<body>
<div class="wrap">
  <div class="lang-toggle" id="langToggle">
    <button data-lang="zh">中文</button>
    <button data-lang="en">EN</button>
  </div>
  <div class="brand-eyebrow">WeCan WeShare 公益平台協會</div>
  <h1 data-i18n="title">Speaking Up Taiwan 全英文線上口說課程</h1>
  <div class="subtitle" data-i18n="subtitle">請選擇你的身份，我們會帶你到對應的頁面。</div>
  <div class="cards">
    <a class="card" href="volunteer.html">
      <div class="emoji">🧑‍🏫</div>
      <div class="title" data-i18n="volTitle">我是志工老師</div>
      <div class="desc" data-i18n="volDesc">登記你可以授課的星期與時間，送出後由負責人安排面試並審核。</div>
      <span class="cta volunteer" data-i18n="volCta">前往志工登記 →</span>
    </a>
    <a class="card" href="student.html">
      <div class="emoji">🎒</div>
      <div class="title" data-i18n="stuTitle">我是學生家長</div>
      <div class="desc" data-i18n="stuDesc">歡迎參加 Speaking Up 線上口說課程，請挑一個孩子可以上課的時段完成報名。</div>
      <span class="cta student" data-i18n="stuCta">前往學生報名 →</span>
    </a>
  </div>
</div>

<script>
const I18N = {
  zh: {
    title: "Speaking Up Taiwan 全英文線上口說課程",
    subtitle: "請選擇你的身份，我們會帶你到對應的頁面。",
    volTitle: "我是志工老師",
    volDesc: "登記你可以授課的星期與時間，送出後由負責人安排面試並審核。",
    volCta: "前往志工登記 →",
    stuTitle: "我是學生家長",
    stuDesc: "歡迎參加 Speaking Up 線上口說課程，請挑一個孩子可以上課的時段完成報名。",
    stuCta: "前往學生報名 →",
  },
  en: {
    title: "Speaking Up Taiwan English Online Program",
    subtitle: "Please choose your role and we'll take you to the right page.",
    volTitle: "I'm a volunteer",
    volDesc: "Register the days and times you're available to teach. An admin will review before it goes live.",
    volCta: "Go to volunteer sign-up →",
    stuTitle: "I'm a parent / student",
    stuDesc: "Pick an approved teaching slot and sign up your child.",
    stuCta: "Go to student sign-up →",
  }
};

function applyLang(lang){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(I18N[lang][key]) el.textContent = I18N[lang][key];
  });
  document.querySelectorAll('#langToggle button').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
  localStorage.setItem('speakingup_lang', lang);
}

document.querySelectorAll('#langToggle button').forEach(btn=>{
  btn.addEventListener('click', ()=> applyLang(btn.dataset.lang));
});

applyLang(localStorage.getItem('speakingup_lang') || 'zh');
</script>
</body>
</html>
