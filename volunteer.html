<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaking Up 志工登記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAF6EE; --board: #ffffff; --ink: #1F2B24; --ink-soft: #5B6960;
    --teal: #14685A; --teal-deep: #0D4A40; --lime: #A9CB3B; --coral: #F2764B;
    --line: #E4DCC8; --shadow: 0 10px 30px -14px rgba(20,104,90,0.28); --na: #B4483B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(circle at 12% 8%, rgba(169,203,59,0.10), transparent 40%),
      radial-gradient(circle at 90% 0%, rgba(20,104,90,0.08), transparent 45%),
      var(--bg);
    color:var(--ink); font-family:'Noto Sans TC', sans-serif; padding:28px 16px 60px;
  }
  .wrap{ max-width:720px; margin:0 auto; }
  .top-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .back-link{ font-size:12.5px; color:var(--ink-soft); text-decoration:none; }
  .lang-toggle{ display:flex; gap:4px; background:#EFE9D8; border-radius:100px; padding:3px; }
  .lang-toggle button{
    border:none; background:transparent; font-family:'JetBrains Mono',monospace;
    font-size:11.5px; font-weight:700; padding:6px 12px; border-radius:100px; cursor:pointer; color:var(--ink-soft);
  }
  .lang-toggle button.active{ background:var(--teal-deep); color:#fff; }
  .brand-eyebrow{
    font-family:'JetBrains Mono', monospace; letter-spacing:0.14em; text-transform:uppercase;
    font-size:11px; color:var(--teal); font-weight:600; display:flex; align-items:center; gap:8px; margin-bottom:10px;
  }
  .brand-eyebrow::before{ content:""; width:8px; height:8px; background:var(--lime); border-radius:2px; display:inline-block; }
  h1{ font-family:'Noto Serif TC', serif; font-weight:900; font-size:clamp(24px,4.5vw,32px); margin:0 0 8px; color:var(--teal-deep); }
  .subtitle{ color:var(--ink-soft); font-size:14px; line-height:1.6; margin-bottom:24px; }
  .card{ background:var(--board); border-radius:16px; box-shadow:var(--shadow); padding:26px 24px; }
  .section-title{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:16px; color:var(--teal-deep); margin:24px 0 12px; }
  .section-title:first-child{ margin-top:0; }
  label{ font-size:12.5px; color:var(--ink-soft); font-weight:600; display:block; margin:14px 0 5px; }
  label:first-of-type{ margin-top:0; }
  input[type=text], input[type=email], input[type=number], textarea, select{
    width:100%; font-family:inherit; font-size:14px; padding:10px 12px;
    border-radius:9px; border:1px solid var(--line); background:#FCFAF3;
  }
  textarea{ min-height:70px; resize:vertical; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .hint{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; }
  .radio-group, .checkbox-group{ display:flex; flex-wrap:wrap; gap:10px 16px; margin-top:6px; }
  .radio-group label, .checkbox-group label{
    display:flex; align-items:center; gap:6px; font-size:13.5px; color:var(--ink);
    font-weight:400; margin:0; cursor:pointer;
  }
  .radio-group input, .checkbox-group input{ width:auto; accent-color:var(--teal); }

  .avail-note{ font-size:11.5px; color:var(--ink-soft); margin:4px 0 10px; }
  .avail-scroll{ overflow-x:auto; border-radius:10px; border:1px solid var(--line); }
  table.avail-grid{ border-collapse:collapse; width:100%; min-width:480px; font-size:12px; }
  table.avail-grid th, table.avail-grid td{ text-align:center; padding:7px 4px; border-bottom:1px solid var(--line); }
  table.avail-grid th{ color:var(--ink-soft); font-weight:600; font-size:11px; background:#FCFAF3; white-space:nowrap; }
  table.avail-grid td.day-name{ text-align:left; padding-left:10px; font-weight:700; color:var(--ink); white-space:nowrap; }
  table.avail-grid th.na-col, table.avail-grid td.na-cell{ border-left:2px solid var(--line); }
  table.avail-grid th.na-col{ color:var(--na); }
  .avail-grid input[type=checkbox]{ accent-color:var(--teal); width:16px; height:16px; }
  .avail-grid input.na-check{ accent-color:var(--na); }
  .avail-grid tr:last-child td{ border-bottom:none; }

  .error-msg{ color:#B4483B; font-size:12.5px; margin-top:10px; display:none; }
  .submit-btn{
    margin-top:26px; width:100%; background:var(--coral); color:#fff; border:none;
    font-weight:700; font-size:15px; padding:13px; border-radius:100px; cursor:pointer;
  }
  .submit-btn:hover{ filter:brightness(1.05); }
  .success-box{ text-align:center; padding:20px 0; }
  .success-box .big{ font-size:38px; margin-bottom:10px; }
  .success-box p{ color:var(--ink-soft); font-size:14px; line-height:1.7; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-row">
    <a class="back-link" href="index.html" data-i18n="back">← 回入口頁</a>
    <div class="lang-toggle" id="langToggle">
      <button data-lang="zh">中文</button>
      <button data-lang="en">EN</button>
    </div>
  </div>
  <div class="brand-eyebrow">WeCan WeShare · 公益平台協會</div>
  <h1 data-i18n="h1">志工老師登記</h1>
  <div class="subtitle" data-i18n="subtitle">感謝你願意加入 Speaking Up 台灣全英文口說課程！請完整填寫以下資料，我們審核後會透過你留下的聯絡方式通知你。</div>

  <div class="card" id="formCard">
    <div class="section-title" data-i18n="secBasic">基本資料</div>
    <label data-i18n="lblEnglishName">英文名字</label>
    <input type="text" id="englishName" data-i18n-ph="phEnglishName" placeholder="例如 Andrea">

    <div class="row2">
      <div>
        <label data-i18n="lblGradeYear">年級</label>
        <input type="text" id="gradeYear" data-i18n-ph="phGradeYear" placeholder="例如 大二">
      </div>
      <div>
        <label data-i18n="lblLocation">所在國家或縣市</label>
        <input type="text" id="location" data-i18n-ph="phLocation" placeholder="例如 台灣台北">
      </div>
    </div>

    <label data-i18n="lblSchool">就讀學校</label>
    <input type="text" id="school" data-i18n-ph="phSchool" placeholder="例如 台灣大學">

    <label data-i18n="lblTeachExp">是否有教學經驗？<span class="hint" data-i18n="hintNoAffect">（不影響錄取率）</span></label>
    <div class="radio-group">
      <label><input type="radio" name="teachingExperience" value="有"> <span data-i18n="yes">有</span></label>
      <label><input type="radio" name="teachingExperience" value="沒有"> <span data-i18n="no">沒有</span></label>
    </div>

    <label data-i18n="lblSpeaksChinese">是否會說中文？<span class="hint" data-i18n="hintNoAffect2">（不影響錄取率）</span></label>
    <div class="radio-group">
      <label><input type="radio" name="speaksChinese" value="會"> <span data-i18n="yes2">會</span></label>
      <label><input type="radio" name="speaksChinese" value="不會"> <span data-i18n="no2">不會</span></label>
    </div>

    <div class="section-title" data-i18n="secContact">聯絡方式</div>
    <label data-i18n="lblContactPref">偏好聯繫方式</label>
    <div class="checkbox-group">
      <label><input type="checkbox" name="contactPref" value="LINE"> LINE</label>
      <label><input type="checkbox" name="contactPref" value="WhatsApp"> WhatsApp</label>
    </div>

    <label data-i18n="lblContactId">LINE ID 或 WhatsApp 號碼</label>
    <input type="text" id="contactId" data-i18n-ph="phContactId" placeholder="方便聯繫的帳號或號碼">

    <label>Email <span style="color:#B4483B;">*</span></label>
    <input type="email" id="email" placeholder="name@example.com" required>

    <label data-i18n="lblInstagram">Instagram 帳號</label>
    <input type="text" id="instagram" data-i18n-ph="phInstagram" placeholder="沒有請填 N/A">

    <div class="section-title" data-i18n="secAvail">授課意願</div>
    <label data-i18n="lblClassesPerWeek">一週想教幾堂課？</label>
    <input type="number" id="classesPerWeek" min="1" data-i18n-ph="phClassesPerWeek" placeholder="例如 1">
    <div class="avail-note" data-i18n="availHint">若只教一堂課，請在下方勾選一個可以的時間就好；若想教兩堂課，請勾選兩個可以的時間，以此類推。</div>

    <label data-i18n="lblWeekdayGrid">平日晚上可授課時段（17:00–21:00）</label>
    <div class="avail-note" data-i18n="availNote">勾選你方便的小時段；如果那天完全沒空，勾右邊「不可」就好</div>
    <div class="avail-scroll">
      <table class="avail-grid" id="weekdayGrid"></table>
    </div>

    <label data-i18n="lblWeekendGrid" style="margin-top:20px;">週末可授課時段（9:00–21:00）</label>
    <div class="avail-note" data-i18n="availNote2">勾選你方便的小時段；如果那天完全沒空，勾右邊「不可」就好</div>
    <div class="avail-scroll">
      <table class="avail-grid" id="weekendGrid"></table>
    </div>

    <div class="section-title" data-i18n="secOther">其他</div>
    <label data-i18n="lblQuestions">有什麼問題或想告訴我們的嗎？</label>
    <textarea id="questions" data-i18n-ph="phQuestions" placeholder="選填"></textarea>

    <div class="error-msg" id="errorMsg" data-i18n="errorMsg">請至少填寫英文名字、聯絡方式，並在平日或週末表格裡選一個時段（或勾不可）</div>
    <button class="submit-btn" id="submitBtn" data-i18n="submitBtn">送出登記</button>
  </div>
</div>

<iframe name="hidden_form_target" style="display:none;"></iframe>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzxDRgkHjGMg4A4BGkyqJDBpwNsK1-jqRlVY2PaanTm3GIVXtbCCXqBvfK4XYhRfmOe/exec';

const WEEKDAY_DAYS = [
  {zh:'星期一', en:'Mon'}, {zh:'星期二', en:'Tue'}, {zh:'星期三', en:'Wed'},
  {zh:'星期四', en:'Thu'}, {zh:'星期五', en:'Fri'},
];
const WEEKDAY_HOURS = ['17:00-18:00','18:00-19:00','19:00-20:00','20:00-21:00'];

const WEEKEND_DAYS = [ {zh:'星期六', en:'Sat'}, {zh:'星期日', en:'Sun'} ];
const WEEKEND_HOURS = Array.from({length:12}, (_,i)=>{
  const h = 9+i;
  return `${String(h).padStart(2,'0')}:00-${String(h+1).padStart(2,'0')}:00`;
});

function shortHour(range){ return range.split('-').map(t=>t.slice(0,2)).join('-'); }

function buildGrid(tableId, days, hours){
  const table = document.getElementById(tableId);
  const naLabel = currentLang === 'zh' ? '不可' : 'N/A';
  let thead = '<thead><tr><th></th>' + hours.map(h=>`<th>${shortHour(h)}</th>`).join('') + `<th class="na-col">${naLabel}</th></tr></thead>`;
  let tbody = '<tbody>' + days.map(d=>{
    const dayLabel = currentLang === 'zh' ? d.zh : d.en;
    const cells = hours.map(h=>`<td><input type="checkbox" data-day="${d.zh}" data-hour="${h}"></td>`).join('');
    return `<tr><td class="day-name">${dayLabel}</td>${cells}<td class="na-cell"><input type="checkbox" class="na-check" data-day="${d.zh}"></td></tr>`;
  }).join('') + '</tbody>';
  table.innerHTML = thead + tbody;

  table.querySelectorAll('.na-check').forEach(na=>{
    na.addEventListener('change', ()=>{
      const day = na.dataset.day;
      if(na.checked){
        table.querySelectorAll(`input[data-day="${day}"]:not(.na-check)`).forEach(cb=>{ cb.checked=false; cb.disabled=true; });
      }else{
        table.querySelectorAll(`input[data-day="${day}"]:not(.na-check)`).forEach(cb=>{ cb.disabled=false; });
      }
    });
  });
}

function collectAvailability(tableId, days){
  const table = document.getElementById(tableId);
  const parts = [];
  days.forEach(d=>{
    const na = table.querySelector(`.na-check[data-day="${d.zh}"]`);
    if(na && na.checked){
      parts.push(`${d.zh}：不可`);
      return;
    }
    const hours = Array.from(table.querySelectorAll(`input[data-day="${d.zh}"]:not(.na-check):checked`)).map(cb=>cb.dataset.hour);
    if(hours.length) parts.push(`${d.zh}：${hours.join('、')}`);
  });
  return parts.join('；');
}

function hasAnySelection(tableId){
  const table = document.getElementById(tableId);
  return table.querySelectorAll('input:checked').length > 0;
}

const I18N = {
  zh: {
    back: "← 回入口頁", h1: "志工老師登記",
    subtitle: "感謝你願意加入 Speaking Up 台灣全英文口說課程！請完整填寫以下資料，我們審核後會透過你留下的聯絡方式通知你。",
    secBasic: "基本資料", lblEnglishName: "英文名字", phEnglishName: "例如 Andrea",
    lblGradeYear: "年級", phGradeYear: "例如 大二",
    lblLocation: "所在國家或縣市", phLocation: "例如 台灣台北",
    lblSchool: "就讀學校", phSchool: "例如 台灣大學",
    lblTeachExp: "是否有教學經驗？", hintNoAffect: "（不影響錄取率）", yes:"有", no:"沒有",
    lblSpeaksChinese: "是否會說中文？", hintNoAffect2: "（不影響錄取率）", yes2:"會", no2:"不會",
    secContact: "聯絡方式", lblContactPref: "偏好聯繫方式（可複選）",
    lblContactId: "LINE ID 或 WhatsApp 號碼", phContactId: "方便聯繫的帳號或號碼",
    lblInstagram: "Instagram 帳號", phInstagram: "沒有請填 N/A",
    secAvail: "授課意願", lblClassesPerWeek: "一週想教幾堂課？", phClassesPerWeek: "例如 1",
    availHint: "若只教一堂課，請在下方勾選一個可以的時間就好；若想教兩堂課，請勾選兩個可以的時間，以此類推。",
    lblWeekdayGrid: "平日晚上可授課時段（17:00–21:00）",
    availNote: "勾選你方便的小時段；如果那天完全沒空，勾右邊「不可」就好",
    lblWeekendGrid: "週末可授課時段（9:00–21:00）",
    availNote2: "勾選你方便的小時段；如果那天完全沒空，勾右邊「不可」就好",
    secOther: "其他", lblQuestions: "有什麼問題或想告訴我們的嗎？", phQuestions: "選填",
    errorMsg: "除了「其他/問題」以外，其餘欄位都必填，請確認都已填寫並至少選一個可授課時段",
    submitBtn: "送出登記",
    successTitle: "登記成功！",
    successBody: "感謝你的登記，我們會審核你的資料，審核通過後會透過你留下的聯絡方式通知你上架時段。",
  },
  en: {
    back: "← Back to home", h1: "Volunteer teacher sign-up",
    subtitle: "Thanks for joining Speaking Up Taiwan! Please fill in the details below — we'll review your application and reach out using the contact info you provide.",
    secBasic: "Basic info", lblEnglishName: "English name", phEnglishName: "e.g. Andrea",
    lblGradeYear: "Grade", phGradeYear: "e.g. Sophomore",
    lblLocation: "Country or city you're based in", phLocation: "e.g. Taipei, Taiwan",
    lblSchool: "School", phSchool: "e.g. National Taiwan University",
    lblTeachExp: "Do you have teaching experience?", hintNoAffect: "(does not affect your acceptance)", yes:"Yes", no:"No",
    lblSpeaksChinese: "Do you speak Chinese?", hintNoAffect2: "(does not affect your acceptance)", yes2:"Yes", no2:"No",
    secContact: "Contact info", lblContactPref: "Preferred contact method (select all that apply)",
    lblContactId: "LINE ID or WhatsApp number", phContactId: "Your ID or number",
    lblInstagram: "Instagram handle", phInstagram: "Enter N/A if you don't have one",
    secAvail: "Teaching availability", lblClassesPerWeek: "How many classes do you want to teach per week?", phClassesPerWeek: "e.g. 1",
    availHint: "If you only want to teach one class, check just one time slot below. If you want to teach two classes, check two slots, and so on.",
    lblWeekdayGrid: "Weekday evening availability (17:00–21:00)",
    availNote: "Check every hour that works for you. If you're not free at all that day, check \"N/A\" on the right instead.",
    lblWeekendGrid: "Weekend availability (9:00–21:00)",
    availNote2: "Check every hour that works for you. If you're not free at all that day, check \"N/A\" on the right instead.",
    secOther: "Anything else", lblQuestions: "Any questions or feedback?", phQuestions: "Optional",
    errorMsg: "All fields are required except the optional questions/feedback field — please fill everything in and select at least one available time slot",
    submitBtn: "Submit application",
    successTitle: "Application submitted!",
    successBody: "Thanks for applying. We'll review your info and reach out using your contact details once it's approved.",
  }
};

let currentLang = 'zh';

function applyLang(lang){
  currentLang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(I18N[lang][key] !== undefined) el.textContent = I18N[lang][key];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    const key = el.getAttribute('data-i18n-ph');
    if(I18N[lang][key] !== undefined) el.placeholder = I18N[lang][key];
  });
  document.querySelectorAll('#langToggle button').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
  localStorage.setItem('speakingup_lang', lang);
  buildGrid('weekdayGrid', WEEKDAY_DAYS, WEEKDAY_HOURS);
  buildGrid('weekendGrid', WEEKEND_DAYS, WEEKEND_HOURS);
}
document.querySelectorAll('#langToggle button').forEach(btn=>{
  btn.addEventListener('click', ()=> applyLang(btn.dataset.lang));
});
applyLang(localStorage.getItem('speakingup_lang') || 'zh');

function getChecked(name){
  return Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(i=>i.value);
}
function getRadio(name){
  const el = document.querySelector(`input[name="${name}"]:checked`);
  return el ? el.value : '';
}

document.getElementById('submitBtn').addEventListener('click', ()=>{
  const englishName = document.getElementById('englishName').value.trim();
  const gradeYear = document.getElementById('gradeYear').value.trim();
  const location = document.getElementById('location').value.trim();
  const school = document.getElementById('school').value.trim();
  const contactId = document.getElementById('contactId').value.trim();
  const email = document.getElementById('email').value.trim();
  const instagram = document.getElementById('instagram').value.trim();
  const classesPerWeek = document.getElementById('classesPerWeek').value;
  const teachingExperience = getRadio('teachingExperience');
  const speaksChinese = getRadio('speaksChinese');
  const contactPref = getChecked('contactPref');
  const anyWeekday = hasAnySelection('weekdayGrid');
  const anyWeekend = hasAnySelection('weekendGrid');

  const allRequiredFilled = englishName && gradeYear && location && school &&
    teachingExperience && speaksChinese && contactPref.length > 0 &&
    contactId && email && instagram && classesPerWeek && (anyWeekday || anyWeekend);

  if(!allRequiredFilled){
    document.getElementById('errorMsg').style.display = 'block';
    return;
  }
  document.getElementById('errorMsg').style.display = 'none';

  const fields = {
    action: 'volunteerApply',
    lang: currentLang,
    englishName,
    gradeYear,
    location,
    school,
    teachingExperience,
    speaksChinese,
    contactPref: contactPref.join('、'),
    contactId,
    email,
    instagram,
    classesPerWeek,
    weekdayAvailability: collectAvailability('weekdayGrid', WEEKDAY_DAYS),
    weekendAvailability: collectAvailability('weekendGrid', WEEKEND_DAYS),
    questions: document.getElementById('questions').value.trim(),
  };

  const form = document.createElement('form');
  form.action = APPS_SCRIPT_URL;
  form.method = 'POST';
  form.target = 'hidden_form_target';
  Object.entries(fields).forEach(([name, value])=>{
    const input = document.createElement('input');
    input.type = 'hidden'; input.name = name; input.value = value;
    form.appendChild(input);
  });
  document.body.appendChild(form);
  form.submit();
  document.body.removeChild(form);

  document.getElementById('formCard').innerHTML = `
    <div class="success-box">
      <div class="big">🎉</div>
      <h1 style="font-size:20px;">${I18N[currentLang].successTitle}</h1>
      <p>${I18N[currentLang].successBody}</p>
    </div>`;
});
</script>
</body>
</html>
